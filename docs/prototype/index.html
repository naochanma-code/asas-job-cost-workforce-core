<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASAS · Milestone 0 Process Prototype</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#17332e;background:#f2f5f1;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#123c34;color:white;padding:22px 5vw}header h1{font-size:23px;margin:0 0 8px}header p{margin:0;line-height:1.6}.badge{background:#d4f386;color:#18352f;padding:5px 10px;border-radius:20px;font-size:12px;display:inline-block}.shell{max-width:1150px;margin:auto;padding:24px}.bar{display:flex;flex-wrap:wrap;gap:16px;align-items:end;background:white;padding:18px;border-radius:12px}label{display:block;font-size:14px;font-weight:600;margin:8px 0}select,input,textarea{font:inherit;border:1px solid #bacac3;border-radius:7px;padding:10px;width:100%;background:white;color:#17332e}textarea{min-height:75px}.bar label{min-width:180px}button{font:inherit;border:0;border-radius:8px;background:#17634e;color:white;padding:11px 16px;cursor:pointer;margin:4px 4px 4px 0}button.secondary{background:#e5ede7;color:#17332e}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #cb8700;outline-offset:3px}.grid{display:grid;grid-template-columns:245px 1fr;gap:24px;margin-top:24px}nav button{display:block;width:100%;text-align:left;background:white;color:#17332e;border:1px solid #d4dfd8}nav button.active{background:#17634e;color:white}.panel{background:white;border:1px solid #d9e2dc;border-radius:12px;padding:26px;min-height:380px}h2{font-size:22px;margin-top:0}h3{font-size:17px}p,li{line-height:1.7}.muted{color:#536b62;font-size:14px}.notice{padding:12px;border-left:4px solid #b97913;background:#fff7e8;margin:14px 0;line-height:1.6}.card{border:1px solid #d8e3da;border-radius:9px;padding:16px;margin:14px 0}.metric{font-size:26px;font-weight:700}.row{display:flex;gap:18px;flex-wrap:wrap}.row>div{flex:1;min-width:150px}.status{font-size:13px;background:#eef4df;border-radius:5px;padding:4px 8px}#message{padding:12px 0;color:#174b37;min-height:44px}footer{font-size:12px;color:#50675d;padding:12px 0}a{color:#17634e}details{margin:12px 0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px;text-align:left;border-bottom:1px solid #dbe5df}@media(max-width:720px){.shell{padding:14px}.grid{grid-template-columns:1fr;gap:14px}nav{display:flex;overflow-x:auto;gap:8px}nav button{min-width:160px}.panel{padding:18px}.bar label{min-width:130px;flex:1}header{padding:18px}}
</style></head>
<body><header><span class="badge">ข้อมูลสมมติ · M0 REVIEW</span><h1>ASAS · ทดลองกระบวนการทำงาน</h1><p>Project เป็นจุดเริ่มต้น • ต้นแบบในเครื่อง ไม่มี backend หรือการส่ง LINE จริง</p></header>
<main class="shell"><section class="bar" aria-label="ตัวช่วยทดสอบ">
<label>บทบาทจำลอง<select id="role"><option>TECH</option><option>ADMIN</option><option>OWNER</option><option>PM</option></select></label>
<label>ผู้ส่งจำลอง<select id="sender"><option>DEMO-T1</option><option>DEMO-T2</option></select></label>
<label>โครงการ<select id="project"><option value="A">DEMO-PRJ-A</option><option value="B">DEMO-PRJ-B</option></select></label>
<button class="secondary" id="reset">เริ่มใหม่</button></section>
<div class="grid"><nav id="nav" aria-label="งานทดลอง"></nav><section class="panel"><div id="screen"></div><div id="message" role="status" aria-live="polite"></div></section></div>
<footer>การสลับบทบาทใช้ตรวจ flow เท่านั้น ไม่ใช่ระบบสิทธิ์จริง • Refresh ล้างข้อมูล • ห้ามกรอกข้อมูลจริง • <a href="../PILOT_ACCEPTANCE_SCRIPT.md">บทตรวจรับ</a></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={jobs:'1 · งานของฉัน',work:'2 · ลงวันทำงาน',ot:'3 · ลง OT',expense:'4 · ส่งค่าใช้จ่าย',status:'ตรวจสถานะของฉัน',review:'5 · ตรวจและดูต้นทุน',evidence:'6 · หลักฐานรายเดือน',payroll:'7 · ตรวจรอบค่าจ้าง'};
let page='jobs',records=[],draft=null,run='OPEN',audit=[],exportRevision=0;
const role=()=>$('role').value, project=()=>$('project').value, sender=()=>$('sender').value;
const allowed=()=>role()==='TECH'?['jobs','work','ot','expense','status']:role()==='PM'?['jobs','review']:['jobs','review','evidence','payroll'];
const money=n=>(n/100).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const visible=()=>records.filter(r=>r.project===project()&&(role()!=='TECH'||r.sender===sender()));
function say(t){$('message').textContent=t}
function button(t,fn,secondary=false){const b=document.createElement('button');b.textContent=t;if(secondary)b.className='secondary';b.onclick=fn;return b}
function actions(...items){const d=document.createElement('div');items.forEach(x=>d.append(x));$('screen').append(d)}
function navigate(next){if(draft&&!confirm('มีข้อมูลยังไม่ได้ส่ง ต้องการละทิ้งและออกจากหน้านี้หรือไม่?'))return;draft=null;page=next;render()}
function render(){if(!allowed().includes(page))page='jobs';$('nav').replaceChildren();allowed().forEach(k=>{const b=button(labels[k],()=>navigate(k));if(k===page)b.classList.add('active');$('nav').append(b)});$('message').textContent='';$('screen').innerHTML='';if(role()==='PM'&&project()==='A'){$('screen').innerHTML='<h2>ไม่มีสิทธิ์โครงการนี้</h2><p>DEMO-PM ได้รับมอบหมายเฉพาะโครงการ B</p>';return}({jobs,work:()=>entry('work'),ot:()=>entry('ot'),expense:()=>entry('expense'),status,review,evidence,payroll}[page])()}
function jobs(){$('screen').innerHTML='<h2>งานของฉัน</h2><p class="muted">งานที่ได้รับมอบหมาย · '+esc(sender())+'</p><div class="card"><h3>DEMO-PRJ-'+project()+'</h3><p>'+(project()==='A'?'ดูแลระบบ — มอบหมายระดับโครงการ':'ติดตั้งระบบ — DEMO-SITE-B')+'</p><span class="status">กำลังดำเนินการ</span></div>'+(project()==='B'?'<details><summary>ดูงานย่อย</summary><p>DEMO-JOB-B1 · ติดตั้ง<br>DEMO-JOB-B2 · ทดสอบ</p></details>':'');if(role()==='TECH')actions(button('ลงวันทำงาน',()=>navigate('work')),button('ลง OT',()=>navigate('ot')),button('ส่งค่าใช้จ่าย',()=>navigate('expense')))}
function jobField(){return project()==='B'?'<details><summary>ระบุงานย่อย (เพิ่มเติม)</summary><label>งานย่อย<select id="job"><option value="">บันทึกระดับโครงการ</option><option value="B1">DEMO-JOB-B1 · ติดตั้ง</option><option value="B2">DEMO-JOB-B2 · ทดสอบ</option></select></label></details>':''}
function entry(kind){draft={kind};$('screen').innerHTML='<h2>'+labels[kind]+'</h2><p>DEMO-PRJ-'+project()+' · '+esc(sender())+'</p><form id="entryForm"><label>วันที่<input id="date" type="date" value="2026-09-21" required></label>'+jobField()+(kind==='work'?'<label>ช่วงวัน<select id="part"><option value="FULL">เต็มวัน</option><option value="AM">เช้า</option><option value="PM">บ่าย</option></select></label>':kind==='ot'?'<label>จำนวนชั่วโมง<input id="hours" type="number" min="0.5" step="0.5" value="2" required></label><p class="muted">ต้นแบบใช้ชั่วโมงเต็ม/ครึ่งชั่วโมง กรณีรายนาทีและข้ามคืนรอ Q-03</p>':'<label>ประเภทรายจ่าย<select id="category"><option value="FUEL">ค่าน้ำมัน</option><option value="MATERIAL_DIRECT">วัสดุซื้อใช้ตรงกับงาน</option></select></label><label>จำนวนเงิน (บาท)<input id="amount" type="number" min="0.01" step="0.01" value="500" required></label><label>จำนวนหลักฐานจำลอง<select id="images"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><p class="muted">ใช้ภาพ placeholder ตามจำนวนที่เลือก ไม่อัปโหลดบิลจริง</p>')+'<label>'+(kind==='ot'?'เหตุผล':'รายละเอียด')+'<textarea id="note" '+(kind==='work'?'':'required')+'>'+(kind==='expense'?'เติมรถไปหน้างาน':kind==='ot'?'ทดสอบระบบหลังเวลางาน':'')+'</textarea></label><button type="submit">ตรวจสรุป</button></form>';$('entryForm').onsubmit=e=>{e.preventDefault();draft={kind,project:project(),sender:sender(),date:$('date').value,job:$('job')?.value||null,note:$('note').value,part:$('part')?.value,hours:Number($('hours')?.value||0),amount:Math.round(Number($('amount')?.value||0)*100),category:$('category')?.value,images:Number($('images')?.value||0)};confirmEntry()};actions(button('ยกเลิก',()=>{draft=null;page='jobs';render()},true))}
function description(r){return '<p>โครงการ DEMO-PRJ-'+r.project+(r.job?'<br>งานย่อย DEMO-JOB-'+esc(r.job):'')+'<br>วันที่ '+esc(r.date)+'<br>'+(r.kind==='work'?'ช่วงวัน '+({FULL:'เต็มวัน',AM:'เช้า',PM:'บ่าย'}[r.part]):r.kind==='ot'?'OT '+r.hours+' ชั่วโมง':'หมวด '+esc(r.category)+'<br>ยอด '+money(r.amount)+' บาท<br>หลักฐานจำลอง '+r.images+' ไฟล์')+'<br>'+esc(r.note)+'</p>'}
function confirmEntry(){$('screen').innerHTML='<h2>ตรวจสรุปก่อนส่ง</h2>'+description(draft);actions(button('ยืนยันส่งตรวจ',()=>{if(!draft)return;const id='DEMO-'+String(records.length+1).padStart(3,'0');records.push({...draft,id,status:draft.kind==='expense'?'PENDING_REVIEW':'SUBMITTED',late:run!=='OPEN'});draft=null;page='status';render();say(id+' บันทึกจำลองแล้ว · รอตรวจ ยังไม่เป็น Actual'+(run!=='OPEN'?' · LATE_ADJUSTMENT แยกจากรอบที่ปิดเวลาแล้ว':''))}),button('แก้ไข',()=>{const saved={...draft};entry(saved.kind);$('date').value=saved.date;if($('job')){$('job').value=saved.job||'';if(saved.job)$('job').closest('details').open=true}if($('part'))$('part').value=saved.part;if($('hours'))$('hours').value=saved.hours;if($('amount'))$('amount').value=saved.amount/100;if($('category'))$('category').value=saved.category;if($('images'))$('images').value=saved.images;$('note').value=saved.note},true),button('ยกเลิก',()=>{draft=null;page='jobs';render()},true))}
function status(){$('screen').innerHTML='<h2>ตรวจสถานะของฉัน</h2>';const rows=visible();if(!rows.length)$('screen').innerHTML+='<p>ยังไม่มีรายการ เริ่มลงงานจากงานของฉันได้</p>';rows.forEach(r=>{$('screen').innerHTML+='<div class="card"><strong>'+r.id+'</strong> <span class="status">'+r.status+'</span>'+description(r)+(r.late?'<p>LATE_ADJUSTMENT · รอ Owner พิจารณา</p>':'')+'</div>'})}
function payrollAmount(r){if(r.kind==='expense')return 0;const holiday=new Date(r.date+'T12:00:00Z').getUTCDay()===0||r.date==='2026-09-28';return r.kind==='work'?97000*(r.part==='FULL'?1:.5)*(holiday?2:1)+12000*(r.part==='FULL'?1:.5):(holiday?36400:24300)*r.hours}
function review(){$('screen').innerHTML='<h2>ตรวจและดูต้นทุน</h2><p class="muted">'+(role()==='OWNER'?'Owner เห็นต้นทุนทั้งหมดของข้อมูลจำลอง':'เฉพาะหมวดค่าใช้จ่ายที่มีสิทธิ์ · ไม่ใช่ยอดรวม Project (Q-01)')+'</p>';const rows=visible(),approved=rows.filter(r=>r.status==='APPROVED'),fuel=approved.filter(r=>r.kind==='expense'&&r.category==='FUEL').reduce((s,r)=>s+r.amount,0);$('screen').innerHTML+='<div class="row"><div class="card">งบ FUEL<div class="metric">2,000.00</div></div><div class="card">Actual FUEL<div class="metric">'+money(fuel)+'</div></div><div class="card">คงเหลือ FUEL<div class="metric">'+money(200000-fuel)+'</div></div></div><p>ใช้ไป '+(fuel/200000*100).toFixed(1)+'% · รายการรอตรวจยังไม่รวม Actual</p>';if(role()==='OWNER')$('screen').innerHTML+='<p>Actual ทั้งหมดจำลอง: '+money(approved.reduce((s,r)=>s+(r.kind==='expense'?r.amount:payrollAmount(r)),0))+' บาท</p>';if(!rows.length)$('screen').innerHTML+='<p>ยังไม่มีรายการ ให้สวมบท TECH ส่งรายการก่อน</p>';rows.forEach(r=>{const d=document.createElement('div');d.className='card';d.innerHTML='<strong>'+r.id+' · '+r.kind+'</strong> <span class="status">'+r.status+'</span>'+description(r);if(!['APPROVED','REJECTED'].includes(r.status)&&role()!=='PM'){if(r.kind==='expense')d.append(button('แก้รายการพร้อมเหตุผล',()=>editExpense(r),true));d.append(button('อนุมัติ',()=>{r.status='APPROVED';audit.push(r.id+' APPROVED');render();say('อนุมัติจำลองแล้ว · กดซ้ำไม่เพิ่มรายการต้นทุน')}),button('ปฏิเสธ',()=>{const reason=prompt('เหตุผลที่ไม่อนุมัติ');if(reason?.trim()){r.status='REJECTED';audit.push(r.id+' REJECTED '+reason);render()}},true))}$('screen').append(d)});if(role()==='PM')say('PM ตรวจอนุมัติไม่ได้จน Owner เปิด policy')}
function editExpense(r){$('screen').innerHTML='<h2>แก้รายการก่อนอนุมัติ</h2><form id="editForm"><label>ยอด (บาท)<input id="editAmount" type="number" min="0.01" step="0.01" required value="'+r.amount/100+'"></label><label>รายละเอียด<textarea id="editNote" required>'+esc(r.note)+'</textarea></label><label>เหตุผลการแก้ไข<textarea id="editReason" required></textarea></label><button>บันทึกการแก้ไข</button></form>';$('editForm').onsubmit=e=>{e.preventDefault();const next=Math.round(Number($('editAmount').value)*100);audit.push(r.id+' BEFORE '+r.amount+' AFTER '+next+' REASON '+$('editReason').value);r.amount=next;r.note=$('editNote').value;render();say('บันทึกค่าเดิม ค่าใหม่ และเหตุผลในประวัติจำลองแล้ว')};actions(button('กลับ',render,true))}
function evidence(){$('screen').innerHTML='<h2>หลักฐานบัญชี · กันยายน 2026</h2><p>DEMO-PRJ-'+project()+' · Approved expense เท่านั้น</p>';const rows=visible().filter(r=>r.kind==='expense'&&r.status==='APPROVED'&&r.date.startsWith('2026-09'));$('screen').innerHTML+='<p>'+rows.length+' รายการ · '+rows.reduce((s,r)=>s+r.images,0)+' ไฟล์ · '+money(rows.reduce((s,r)=>s+r.amount,0))+' บาท</p>';rows.forEach(r=>$('screen').innerHTML+='<div class="card">'+r.id+' · '+r.images+' หลักฐานจำลอง · '+money(r.amount)+' บาท</div>');actions(button('ดูตัวอย่างชุดส่งบัญชี',()=>{exportRevision++;say('Export preview r'+exportRevision+' · '+rows.length+' expenses / '+rows.reduce((s,r)=>s+r.images,0)+' evidence · ต้นแบบไม่ได้สร้าง ZIP จริง')}));$('screen').insertAdjacentHTML('beforeend','<p class="notice">หลักฐานจำลองเท่านั้น รายละเอียดไฟล์ CSV/XLSX/checksum อยู่ใน Accounting Evidence Specification</p>')}
function payroll(){$('screen').innerHTML='<h2>ตรวจรอบค่าจ้าง · กันยายน 2026</h2><span class="status">'+run+'</span><p>ตัดข้อมูลถึง 30 ก.ย. · Admin ตรวจภายใน 1 ต.ค. 10:00 · Owner บันทึกจ่ายภายในวันที่ 1</p>';const source=records.filter(r=>r.kind!=='expense'&&r.status==='APPROVED'&&!r.late&&r.date.startsWith('2026-09'));$('screen').innerHTML+='<p>วันทำงานที่ตรวจแล้ว '+source.filter(r=>r.kind==='work').length+' รายการ · OT '+source.filter(r=>r.kind==='ot').reduce((s,r)=>s+r.hours,0)+' ชั่วโมง</p>';if(role()==='ADMIN'){ $('screen').innerHTML+='<p class="notice">หน้านี้แสดงเฉพาะเวลา สถานะ และข้อผิดปกติ</p>';if(run==='OPEN')actions(button('ส่งให้ Owner ตรวจ',()=>{if(!source.length){say('ยังไม่มีข้อมูลเวลาที่อนุมัติ');return}run='TIME_REVIEWED';audit.push(run);render()}));else say('ส่งข้อมูลเวลาแล้ว รอ Owner ดำเนินการ');return}if(run==='OPEN'){say('เริ่มจาก Admin ตรวจวันและ OT แล้วส่งให้ Owner');return}if(run==='TIME_REVIEWED'){actions(button('คำนวณสรุปจำลอง',()=>{run='OWNER_REVIEW';audit.push(run);render()}));return}$('screen').innerHTML+='<details><summary>เปิดดูยอดสรุปจำลอง (Owner)</summary><p>อัตราตัวอย่าง 970 บาท/วัน · รวม '+money(source.reduce((s,r)=>s+payrollAmount(r),0))+' บาท</p><p>สูตรและข้อจำกัดตามเอกสาร golden cases ไม่มีภาษี/ประกันสังคมอัตโนมัติ</p></details>';const next={OWNER_REVIEW:['อนุมัติสรุป','APPROVED'],APPROVED:['Lock รอบ','LOCKED'],LOCKED:['บันทึกโอนจำลอง','PAID']}[run];if(next)actions(button(next[0],()=>{run=next[1];audit.push(run);render()}));if(run==='PAID')say('PAID จำลอง · ไม่ได้โอนเงินจริง · การแก้หลังจ่ายต้องเข้ารอบถัดไป');$('screen').insertAdjacentHTML('beforeend','<p class="muted">ประวัติสถานะ: '+esc(audit.filter(x=>!x.startsWith('DEMO-')).join(' → '))+'</p>')}
for(const id of ['role','project','sender'])$(id).onchange=()=>{draft=null;render()};$('reset').onclick=()=>{if(confirm('ล้างข้อมูลจำลองทั้งหมดและเริ่มใหม่?')){records=[];draft=null;run='OPEN';audit=[];exportRevision=0;page='jobs';render()}};render();
</script></body></html>

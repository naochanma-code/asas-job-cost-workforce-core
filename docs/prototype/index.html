<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASAS · Milestone 0 Process Prototype</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#17332e;background:#f2f5f1;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#123c34;color:white;padding:22px 5vw}header h1{font-size:23px;margin:0 0 8px}header p{margin:0;line-height:1.6}.badge{background:#d4f386;color:#18352f;padding:5px 10px;border-radius:20px;font-size:12px;display:inline-block}.shell{max-width:1150px;margin:auto;padding:24px}.bar{display:flex;flex-wrap:wrap;gap:16px;align-items:end;background:white;padding:18px;border-radius:12px}label{display:block;font-size:14px;font-weight:600;margin:8px 0}select,input,textarea{font:inherit;border:1px solid #bacac3;border-radius:7px;padding:10px;width:100%;background:white;color:#17332e}textarea{min-height:75px}.bar label{min-width:180px}button{font:inherit;border:0;border-radius:8px;background:#17634e;color:white;padding:11px 16px;cursor:pointer;margin:4px 4px 4px 0}button.secondary{background:#e5ede7;color:#17332e}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #cb8700;outline-offset:3px}.grid{display:grid;grid-template-columns:245px 1fr;gap:24px;margin-top:24px}nav button{display:block;width:100%;text-align:left;background:white;color:#17332e;border:1px solid #d4dfd8}nav button.active{background:#17634e;color:white}.panel{background:white;border:1px solid #d9e2dc;border-radius:12px;padding:26px;min-height:380px}h2{font-size:22px;margin-top:0}h3{font-size:17px}p,li{line-height:1.7}.muted{color:#536b62;font-size:14px}.notice{padding:12px;border-left:4px solid #b97913;background:#fff7e8;margin:14px 0;line-height:1.6}.card{border:1px solid #d8e3da;border-radius:9px;padding:16px;margin:14px 0}.metric{font-size:26px;font-weight:700}.row{display:flex;gap:18px;flex-wrap:wrap}.row>div{flex:1;min-width:150px}.status{font-size:13px;background:#eef4df;border-radius:5px;padding:4px 8px}#message{padding:12px 0;color:#174b37;min-height:44px}footer{font-size:12px;color:#50675d;padding:12px 0}a{color:#17634e}details{margin:12px 0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px;text-align:left;border-bottom:1px solid #dbe5df}@media(max-width:720px){.shell{padding:14px}.grid{grid-template-columns:1fr;gap:14px}nav{display:flex;overflow-x:auto;gap:8px}nav button{min-width:160px}.panel{padding:18px}.bar label{min-width:130px;flex:1}header{padding:18px}}
.attachments{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.attachment{border:1px solid #d8e3da;border-radius:8px;padding:10px;max-width:220px}.attachment img{width:170px;height:120px;object-fit:contain;background:#f2f5f1}.attachment p{font-size:12px} [hidden]{display:none!important} input[type=file]{max-width:100%}</style></head>
<body><header><span class="badge">ข้อมูลสมมติ · M0 REVIEW</span><h1>ASAS · ทดลองกระบวนการทำงาน</h1><p>Project เป็นจุดเริ่มต้น • ต้นแบบในเครื่อง ไม่มี backend หรือการส่ง LINE จริง</p></header>
<main class="shell"><section class="bar" aria-label="ตัวช่วยทดสอบ">
<label>บทบาทจำลอง<select id="role"><option>TECH</option><option>ADMIN</option><option>OWNER</option><option>PM</option></select></label>
<label id="senderControl">ผู้ส่งจำลอง<select id="sender"><option>DEMO-T1</option><option>DEMO-T2</option></select></label>
<label id="ownerControl" hidden>บัญชี Owner<select id="owner"><option>DEMO-OWNER-1</option><option>DEMO-OWNER-2</option><option>DEMO-OWNER-3</option></select></label>
<label>โครงการ<select id="project"><option value="A">DEMO-PRJ-A</option><option value="B">DEMO-PRJ-B</option></select></label>
<button class="secondary" id="reset">เริ่มใหม่</button></section>
<div class="grid"><nav id="nav" aria-label="งานทดลอง"></nav><section class="panel"><div id="screen"></div><div id="message" role="status" aria-live="polite"></div></section></div>
<footer>การสลับบทบาทใช้ตรวจ flow เท่านั้น ไม่ใช่ระบบสิทธิ์จริง • Refresh ล้างข้อมูลและไฟล์ที่เลือก • ห้ามกรอกข้อมูลจริง • <a href="../PILOT_ACCEPTANCE_SCRIPT.md">บทตรวจรับ</a></footer></main>
<script src="model.js"></script>
<script src="ui.js"></script></body></html>

name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: foundation
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: foundation_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foundation -d foundation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://foundation:synthetic-ci-only@127.0.0.1:5432/foundation_test
      - run: pnpm build
      - name: Build staging containers (no deploy)
        run: |
          docker build -f deploy/Dockerfile.api -t asas-api:ci .
          docker build -f deploy/Dockerfile.web --build-arg API_URL=http://api.railway.internal:3001 -t asas-web:ci .
      - name: Smoke staging web container (no public deployment)
        run: |
          docker run -d --name asas-web-ci -p 127.0.0.1:3100:3000 asas-web:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Smoke staging API container (isolated CI database)
        env:
          DATABASE_URL: postgres://foundation:synthetic-ci-only@127.0.0.1:5432/foundation_test
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/m1-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost' -keyout "$RUNNER_TEMP/m1-tls/server.key" -out "$RUNNER_TEMP/m1-tls/server.crt" 2>/dev/null
          docker cp "$RUNNER_TEMP/m1-tls/server.key" "$PG_CONTAINER:/tmp/m1-server.key"
          docker cp "$RUNNER_TEMP/m1-tls/server.crt" "$PG_CONTAINER:/tmp/m1-server.crt"
          docker exec -u 0 "$PG_CONTAINER" chown postgres:postgres /tmp/m1-server.key /tmp/m1-server.crt
          docker exec -u 0 "$PG_CONTAINER" chmod 600 /tmp/m1-server.key
          docker exec "$PG_CONTAINER" psql -U foundation -d foundation_test -c "ALTER SYSTEM SET ssl_cert_file='/tmp/m1-server.crt'"
          docker exec "$PG_CONTAINER" psql -U foundation -d foundation_test -c "ALTER SYSTEM SET ssl_key_file='/tmp/m1-server.key'"
          docker exec "$PG_CONTAINER" psql -U foundation -d foundation_test -c "ALTER SYSTEM SET ssl=on"
          docker exec "$PG_CONTAINER" psql -U foundation -d foundation_test -c 'SELECT pg_reload_conf()'
          export DATABASE_SSL_CA="$(cat "$RUNNER_TEMP/m1-tls/server.crt")"
          docker run --rm --network host -e DATABASE_URL -e DATABASE_SSL_CA asas-api:ci pnpm migrate
          docker run -d --name asas-api-ci --network host -e DATABASE_URL -e DATABASE_SSL_CA -e WEB_ORIGIN=https://staging.example.test asas-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs asas-api-ci
          exit 1
      - run: node docs/verification/check-m0.mjs && node docs/verification/check-r2.mjs && node docs/verification/check-r4.mjs

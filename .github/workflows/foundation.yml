name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: foundation
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: foundation_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foundation -d foundation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://foundation:synthetic-ci-only@127.0.0.1:5432/foundation_test
      - run: pnpm build
      - run: node docs/verification/check-m0.mjs && node docs/verification/check-r2.mjs && node docs/verification/check-r4.mjs
